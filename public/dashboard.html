<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📼</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b0f;
    --bg-elev: #12141b;
    --bg-card: #171a23;
    --border: #262a37;
    --border-soft: #1d2029;
    --text: #eef0f6;
    --text-dim: #9198ac;
    --text-faint: #5b6272;
    --accent: #7c6cff;
    --accent-soft: #7c6cff22;
    --green: #35d68f;
    --green-soft: #35d68f1e;
    --red: #ff5d6c;
    --red-soft: #ff5d6c1e;
    --amber: #ffb545;
    --amber-soft: #ffb5451e;
    --radius: 16px;
    --shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, #241a4a44, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0f2d2444, transparent 55%),
      var(--bg);
    min-height: 100vh;
  }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 80px; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #4f9dff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 8px 24px -8px #7c6cff88;
  }
  .brand h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .brand .sub { font-size: 12.5px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 var(--green-soft);
    animation: pulse-dot 2s infinite;
    display: inline-block;
  }
  @keyframes pulse-dot {
    0% { box-shadow: 0 0 0 0 #35d68f55; }
    70% { box-shadow: 0 0 0 7px #35d68f00; }
    100% { box-shadow: 0 0 0 0 #35d68f00; }
  }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .wa-link {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-card); border: 1px solid var(--border);
    padding: 9px 14px; border-radius: 999px;
    color: var(--text); text-decoration: none; font-size: 13px; font-weight: 600;
    transition: border-color .15s, transform .15s;
  }
  .wa-link:hover { border-color: var(--green); transform: translateY(-1px); }
  .wa-link[hidden] { display: none; }

  /* ---------- Stat chips ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .stat {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
  }
  .stat .label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* ---------- Paste bar ---------- */
  .paste-card {
    background: linear-gradient(135deg, #1a1530, #101526);
    border: 1px solid #3a2f66;
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .paste-form { display: flex; gap: 10px; flex-wrap: wrap; }
  .paste-input-wrap { flex: 1 1 320px; position: relative; }
  .paste-input-wrap::before {
    content: "🔗"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: .8; pointer-events: none;
  }
  .paste-form input {
    width: 100%; background: #0c0e15; border: 1px solid #322a54;
    color: var(--text); border-radius: 12px; padding: 13px 16px 13px 40px;
    font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .paste-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #7c6cff2a; }
  .paste-form input::placeholder { color: var(--text-faint); }
  .paste-form button {
    background: linear-gradient(135deg, var(--accent), #6a5cf0);
    color: #fff; border: none; border-radius: 12px; padding: 0 22px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: transform .15s, opacity .15s; min-width: 130px; justify-content: center;
  }
  .paste-form button:hover:not(:disabled) { transform: translateY(-1px); }
  .paste-form button:disabled { opacity: .6; cursor: default; }
  .paste-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 9px; }
  .paste-error {
    margin-top: 10px; font-size: 12.5px; color: #ff9aa4;
    background: var(--red-soft); border-radius: 8px; padding: 8px 11px; display: none;
  }
  .paste-error.show { display: block; }
  .btn-spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #ffffff44; border-top-color: #fff;
    animation: spin .7s linear infinite; display: none;
  }
  .paste-form button.loading .btn-spinner { display: inline-block; }
  .paste-form button.loading .btn-label { display: none; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .search {
    flex: 1 1 220px; position: relative;
  }
  .search input {
    width: 100%; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 10px 14px 10px 36px;
    font-size: 13.5px; outline: none; transition: border-color .15s;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: "🔎"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; opacity: .6;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); padding: 7px 13px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none;
    transition: all .15s; white-space: nowrap;
  }
  .pill:hover { color: var(--text); border-color: #3a3f52; }
  .pill.active { background: var(--accent-soft); color: #b6adff; border-color: #7c6cff66; }
  select.sort {
    background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 12px; padding: 9px 12px; font-size: 12.5px; font-weight: 600;
    outline: none; cursor: pointer;
  }

  /* ---------- Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow);
    animation: rise .35s ease both;
    position: relative;
  }
  .card.new-arrival { animation: rise .35s ease both, ring-flash 1.6s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ring-flash {
    0% { box-shadow: var(--shadow), 0 0 0 0 #7c6cffaa; }
    30% { box-shadow: var(--shadow), 0 0 0 4px #7c6cff66; }
    100% { box-shadow: var(--shadow), 0 0 0 0 #7c6cff00; }
  }
  .card.failed { border-color: #ff5d6c44; }

  .thumb {
    position: relative; aspect-ratio: 16 / 9; background: #0d0f15;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; cursor: pointer;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
  .card:hover .thumb img { transform: scale(1.04); }
  .thumb.expired img { filter: grayscale(1) brightness(.5); }
  .thumb .platform-glyph { font-size: 34px; opacity: .35; }

  .badge {
    position: absolute; font-size: 11px; font-weight: 700; padding: 3px 7px;
    border-radius: 6px; backdrop-filter: blur(6px);
  }
  .badge.duration { right: 8px; bottom: 8px; background: #000000b3; color: #fff; font-family: 'JetBrains Mono', monospace; }
  .badge.platform { left: 8px; top: 8px; color: #0a0b0f; font-weight: 800; }

  .play-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, transparent 40%, #000000aa 100%);
    opacity: 0; transition: opacity .18s;
  }
  .thumb:hover .play-overlay { opacity: 1; }
  .play-overlay .btn-play {
    width: 46px; height: 46px; border-radius: 50%; background: #ffffffee;
    display: flex; align-items: center; justify-content: center; font-size: 17px; color: #000;
  }

  .status-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; background: linear-gradient(135deg, #171a23, #1d2130);
  }
  .shimmer {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, #ffffff10 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #ffffff22; border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-overlay .label { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .status-overlay .elapsed { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); }

  .expired-tag {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: #00000066;
  }
  .expired-tag span { font-size: 11.5px; font-weight: 700; color: #fff; background: #000000aa; padding: 4px 10px; border-radius: 999px; }

  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .url {
    font-size: 12.5px; color: var(--text); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .meta-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-faint); flex-wrap: wrap; }
  .dot-sep::before { content: "•"; margin-right: 8px; opacity: .6; }

  .error-msg {
    font-size: 11.5px; color: #ff9aa4; background: var(--red-soft); border-radius: 8px;
    padding: 7px 9px; line-height: 1.4;
  }

  .actions { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .actions button, .actions a {
    flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 8px 0;
    border-radius: 9px; border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--text-dim); cursor: pointer; text-decoration: none; transition: all .15s;
  }
  .actions button:hover, .actions a:hover { color: var(--text); border-color: #3a3f52; }
  .actions .primary { background: var(--accent-soft); color: #b6adff; border-color: #7c6cff55; }
  .actions .danger:hover { color: var(--red); border-color: #ff5d6c55; }

  /* ---------- Empty state ---------- */
  .empty {
    text-align: center; padding: 90px 20px; color: var(--text-dim);
  }
  .empty .glyph { font-size: 46px; margin-bottom: 14px; }
  .empty h2 { color: var(--text); font-size: 17px; margin: 0 0 6px; }
  .empty p { font-size: 13.5px; max-width: 380px; margin: 0 auto; line-height: 1.6; }

  /* ---------- Toasts ---------- */
  .toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .toast {
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow);
    font-size: 13px; max-width: 280px; animation: toast-in .25s ease;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  .toast b { display: block; margin-bottom: 2px; }

  /* ---------- Preview modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: #000000cc; backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal { max-width: 900px; width: 100%; }
  .modal video { width: 100%; border-radius: 12px; max-height: 80vh; background: #000; }
  .modal-close {
    display: block; margin: 12px auto 0; background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px 20px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
  }

  .badge.gif-count {
    left: 8px; bottom: 8px; background: #000000b3; color: #fff;
    display: flex; align-items: center; gap: 3px;
  }

  /* ---------- GIF editor modal ---------- */
  .gif-modal { max-width: 640px; }
  .gif-modal video { width: 100%; border-radius: 12px 12px 0 0; max-height: 50vh; background: #000; display: block; }
  .gif-panel {
    background: var(--bg-card); border: 1px solid var(--border-soft); border-top: none;
    border-radius: 0 0 12px 12px; padding: 16px 18px;
  }
  .gif-range-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .gif-range-row button {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    padding: 8px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .gif-range-row button:hover { border-color: var(--accent); }
  .gif-duration-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim);
    background: var(--bg-elev); padding: 6px 11px; border-radius: 999px; margin-left: auto;
  }
  .gif-duration-pill.over { color: var(--red); }
  .gif-options-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .gif-options-row label { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .gif-options-row select {
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 9px; font-size: 12.5px; cursor: pointer;
  }
  .gif-create-btn {
    margin-left: auto; background: linear-gradient(135deg, var(--accent), #6a5cf0); color: #fff;
    border: none; border-radius: 9px; padding: 10px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .gif-create-btn:disabled { opacity: .55; cursor: default; }
  .gif-create-btn .btn-spinner { border-color: #ffffff44; border-top-color: #fff; }
  .gif-create-btn.loading .btn-spinner { display: inline-block; }
  .gif-create-btn.loading .btn-label { display: none; }
  .gif-error {
    font-size: 12px; color: #ff9aa4; background: var(--red-soft); border-radius: 8px;
    padding: 8px 11px; display: none; margin-bottom: 10px;
  }
  .gif-error.show { display: block; }
  .gif-existing { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 4px; }
  .gif-existing-item { position: relative; border-radius: 9px; overflow: hidden; background: #000; aspect-ratio: 1; }
  .gif-existing-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gif-existing-item .gif-item-actions {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: #000000aa; opacity: 0; transition: opacity .15s;
  }
  .gif-existing-item:hover .gif-item-actions { opacity: 1; }
  .gif-existing-item .gif-item-actions a, .gif-existing-item .gif-item-actions button {
    width: 28px; height: 28px; border-radius: 50%; background: #ffffffee; border: none;
    display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; text-decoration: none; color: #000;
  }
  .gif-section-label { font-size: 11.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 8px; }

  @media (max-width: 520px) {
    .toolbar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="mark">📼</div>
        <div>
          <h1>Video Vault</h1>
          <div class="sub"><span class="live-dot"></span> live · updates every few seconds</div>
        </div>
      </div>
      <div class="header-actions">
        <a class="wa-link" id="waLink" href="#" target="_blank" rel="noopener" hidden>💬 Message the bot</a>
      </div>
    </header>

    <div class="paste-card">
      <form class="paste-form" id="pasteForm">
        <div class="paste-input-wrap">
          <input id="pasteUrl" type="url" inputmode="url" autocomplete="off"
                 placeholder="Paste a YouTube, TikTok, X, Instagram, Facebook, Reddit or LinkedIn link…" required />
        </div>
        <button type="submit" id="pasteBtn">
          <span class="btn-spinner"></span>
          <span class="btn-label">⬇ Fetch video</span>
        </button>
      </form>
      <div class="paste-hint" id="pasteHint">Paste a link and it shows up below the moment it starts downloading.</div>
      <div class="paste-error" id="pasteError"></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="search"><input id="search" type="text" placeholder="Search by link…" /></div>
      <div class="pills" id="platformPills"></div>
      <select class="sort" id="sort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="largest">Largest file</option>
        <option value="longest">Longest video</option>
      </select>
    </div>

    <div id="content"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    const state = {
      jobs: [], knownIds: new Set(), justArrived: new Set(),
      search: '', platform: 'all', sort: 'newest', firstLoad: true,
      gifMaxDurationSeconds: 15,
    };
    let previewOpen = false;

    function fmtBytes(n) {
      if (!n && n !== 0) return '—';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return `${v.toFixed(v >= 10 || i === 0 ? 0 : 1)}${units[i]}`;
    }

    function fmtDuration(s) {
      if (!s && s !== 0) return null;
      s = Math.round(s);
      const m = Math.floor(s / 60), sec = s % 60;
      const h = Math.floor(m / 60);
      if (h) return `${h}:${String(m % 60).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
      return `${m}:${String(sec).padStart(2, '0')}`;
    }

    function fmtAgo(ts) {
      const diff = Math.max(0, Date.now() - ts);
      const s = diff / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    function fmtElapsed(ts) {
      const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
      return `${s}s`;
    }

    function maskNumber(n) {
      if (!n) return 'unknown';
      const digits = n.replace('whatsapp:', '');
      return digits.length > 4 ? `••••${digits.slice(-4)}` : digits;
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function fetchJobs() {
      try {
        const res = await fetch('/api/jobs', { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        handleNewArrivals(data.jobs);
        state.jobs = data.jobs;
        if (data.gifMaxDurationSeconds) state.gifMaxDurationSeconds = data.gifMaxDurationSeconds;
        const waLink = document.getElementById('waLink');
        if (data.whatsappEnabled && data.whatsappNumber) {
          const num = data.whatsappNumber.replace('whatsapp:', '');
          waLink.href = `https://wa.me/${num.replace('+', '')}`;
          waLink.hidden = false;
        } else {
          waLink.hidden = true;
        }
        render();
      } catch (e) {
        // Network hiccup -- just try again on the next poll.
      }
    }

    function handleNewArrivals(jobs) {
      if (state.firstLoad) {
        state.firstLoad = false;
        jobs.forEach((j) => state.knownIds.add(j.id));
        return;
      }
      for (const job of jobs) {
        const prev = state.jobs.find((j) => j.id === job.id);
        if (prev && prev.status === 'downloading' && job.status === 'ready') {
          toast('✅ Video ready', shortUrl(job.url));
        }
        if (prev && prev.status !== 'failed' && job.status === 'failed') {
          toast('❌ Download failed', shortUrl(job.url));
        }
        if (!state.knownIds.has(job.id)) {
          state.knownIds.add(job.id);
          state.justArrived.add(job.id);
          setTimeout(() => state.justArrived.delete(job.id), 2000);
        }
      }
    }

    function toast(title, body) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<b>${escapeHtml(title)}</b>${escapeHtml(body)}`;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }

    function shortUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace('www.', '') + u.pathname.slice(0, 24);
      } catch { return url; }
    }

    function renderStats() {
      const jobs = state.jobs;
      const ready = jobs.filter((j) => j.status === 'ready');
      const done = jobs.filter((j) => j.status === 'ready' || j.status === 'failed');
      const totalBytes = ready.filter((j) => !j.videoExpired).reduce((a, j) => a + (j.sizeBytes || 0), 0);
      const successRate = done.length ? Math.round((ready.length / done.length) * 100) : 100;

      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="num">${jobs.length}</div><div class="label">Total requests</div></div>
        <div class="stat"><div class="num">${fmtBytes(totalBytes)}</div><div class="label">Stored on disk</div></div>
        <div class="stat"><div class="num">${successRate}%</div><div class="label">Success rate</div></div>
        <div class="stat"><div class="num">${jobs.filter((j) => j.status === 'downloading' || j.status === 'queued').length}</div><div class="label">In progress</div></div>
      `;
    }

    function renderPills() {
      const counts = {};
      state.jobs.forEach((j) => { counts[j.platform.key] = (counts[j.platform.key] || 0) + 1; });
      const platforms = [...new Map(state.jobs.map((j) => [j.platform.key, j.platform])).values()];
      const pills = [{ key: 'all', label: 'All', color: '#7c6cff' }, ...platforms];
      document.getElementById('platformPills').innerHTML = pills.map((p) => `
        <div class="pill ${state.platform === p.key ? 'active' : ''}" data-key="${p.key}">
          ${p.label}${p.key !== 'all' ? ` · ${counts[p.key] || 0}` : ''}
        </div>
      `).join('');
      document.querySelectorAll('.pill').forEach((el) => {
        el.onclick = () => { state.platform = el.dataset.key; render(); };
      });
    }

    function cardHtml(job) {
      const platform = job.platform || { label: 'Other', color: '#8b8fa3', key: 'other' };
      const durationBadge = job.durationSeconds ? `<div class="badge duration">${fmtDuration(job.durationSeconds)}</div>` : '';
      const platformBadge = `<div class="badge platform" style="background:${platform.color}">${platform.label}</div>`;

      let thumbInner = '';
      if (job.status === 'queued') {
        thumbInner = `<div class="status-overlay"><div class="spinner" style="opacity:.5"></div><div class="label">Queued…</div></div>`;
      } else if (job.status === 'downloading') {
        thumbInner = `<div class="shimmer"></div><div class="status-overlay"><div class="spinner"></div><div class="label">Downloading</div><div class="elapsed" data-started="${job.startedAt}">${fmtElapsed(job.startedAt)}</div></div>${platformBadge}`;
      } else if (job.status === 'failed') {
        thumbInner = `<div class="status-overlay"><div style="font-size:26px">⚠️</div><div class="label">Failed</div></div>${platformBadge}`;
      } else if (job.status === 'ready') {
        const img = job.thumbnailUrl ? `<img src="${job.thumbnailUrl}" loading="lazy" />` : `<div class="platform-glyph">🎬</div>`;
        if (job.videoExpired) {
          thumbInner = `${img}<div class="expired-tag"><span>🕓 File expired</span></div>`;
        } else {
          thumbInner = `${img}<div class="play-overlay"><div class="btn-play">▶</div></div>${durationBadge}`;
        }
        thumbInner += platformBadge;
        if (job.gifs && job.gifs.length) {
          thumbInner += `<div class="badge gif-count">🎞 ${job.gifs.length}</div>`;
        }
      }

      const thumbClass = job.status === 'ready' && job.videoExpired ? 'thumb expired' : 'thumb';
      const clickPreview = job.status === 'ready' && !job.videoExpired ? `onclick="openPreview('${job.mediaUrl}')"` : '';

      const resLabel = job.height ? `${job.height}p` : '';
      const sizeLabel = job.sizeBytes ? fmtBytes(job.sizeBytes) : '';
      const metaBits = [resLabel, sizeLabel, maskNumber(job.from)].filter(Boolean);

      let actions = '';
      if (job.status === 'ready' && !job.videoExpired) {
        actions = `
          <a class="primary" href="${job.mediaUrl}">⬇ Download</a>
          <button onclick="openGifEditor('${job.id}')">🎞 GIF</button>
          <button class="danger" onclick="deleteJob('${job.id}')">🗑</button>
        `;
      } else if (job.status === 'failed' || (job.status === 'ready' && job.videoExpired)) {
        actions = `
          <button class="primary" onclick="retryJob('${job.id}')">↻ Re-download</button>
          <button class="danger" onclick="deleteJob('${job.id}')">🗑</button>
        `;
      } else {
        actions = `<button disabled style="opacity:.4;cursor:default">⏳ Working…</button>`;
      }

      return `
        <div class="card ${job.status === 'failed' ? 'failed' : ''} ${state.justArrived.has(job.id) ? 'new-arrival' : ''}" data-id="${job.id}">
          <div class="${thumbClass}" ${clickPreview}>${thumbInner}</div>
          <div class="body">
            <div class="title-row"><div class="url" title="${escapeHtml(job.url)}">${escapeHtml(shortUrl(job.url))}</div></div>
            <div class="meta-row">
              <span>${fmtAgo(job.requestedAt)}</span>
              ${metaBits.map((m) => `<span class="dot-sep">${m}</span>`).join('')}
            </div>
            ${job.error ? `<div class="error-msg" title="${escapeHtml(job.error)}">${escapeHtml(job.error)}</div>` : ''}
            <div class="actions">${actions}</div>
          </div>
        </div>
      `;
    }

    function render() {
      renderStats();
      renderPills();

      let jobs = state.jobs.filter((j) => {
        if (state.platform !== 'all' && j.platform.key !== state.platform) return false;
        if (state.search && !j.url.toLowerCase().includes(state.search.toLowerCase())) return false;
        return true;
      });

      const sorters = {
        newest: (a, b) => b.requestedAt - a.requestedAt,
        oldest: (a, b) => a.requestedAt - b.requestedAt,
        largest: (a, b) => (b.sizeBytes || 0) - (a.sizeBytes || 0),
        longest: (a, b) => (b.durationSeconds || 0) - (a.durationSeconds || 0),
      };
      jobs = jobs.sort(sorters[state.sort]);

      const content = document.getElementById('content');
      if (!jobs.length) {
        content.innerHTML = `
          <div class="empty">
            <div class="glyph">📭</div>
            <h2>${state.jobs.length ? 'No matches' : 'No videos yet'}</h2>
            <p>${state.jobs.length
              ? 'Try a different search or platform filter.'
              : 'Paste a video link above and it’ll show up here the moment it starts downloading.'}</p>
          </div>`;
        return;
      }
      content.innerHTML = `<div class="grid">${jobs.map(cardHtml).join('')}</div>`;
    }

    function openPreview(url) {
      previewOpen = true;
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal">
          <video src="${url}" controls autoplay></video>
          <button class="modal-close">Close</button>
        </div>`;
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('.modal-close').onclick = close;
      document.body.appendChild(backdrop);
      function close() { backdrop.remove(); previewOpen = false; }
    }

    // --- GIF editor -----------------------------------------------------------------

    const gifEditor = { jobId: null, start: 0, end: 3 };

    function gifExistingHtml(job) {
      const gifs = job.gifs || [];
      if (!gifs.length) return '';
      return `
        <div class="gif-section-label">Made from this video (${gifs.length})</div>
        <div class="gif-existing">
          ${gifs.map((g) => `
            <div class="gif-existing-item">
              <img src="${g.url}" loading="lazy" />
              <div class="gif-item-actions">
                <a href="${g.url}" download title="Download">⬇</a>
                <button onclick="deleteGif('${job.id}','${g.id}')" title="Delete">🗑</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function updateGifRangeUi() {
      document.getElementById('gifStartLabel').textContent = fmtDuration(gifEditor.start) || '0:00';
      document.getElementById('gifEndLabel').textContent = fmtDuration(gifEditor.end) || '0:00';
      const duration = gifEditor.end - gifEditor.start;
      const pill = document.getElementById('gifDurationPill');
      const over = duration > state.gifMaxDurationSeconds;
      pill.textContent = `${duration.toFixed(1)}s${over ? ` (max ${state.gifMaxDurationSeconds}s)` : ''}`;
      pill.classList.toggle('over', over || duration <= 0);
      document.getElementById('gifCreateBtn').disabled = duration <= 0;
    }

    function openGifEditor(jobId) {
      const job = state.jobs.find((j) => j.id === jobId);
      if (!job) return;

      gifEditor.jobId = jobId;
      gifEditor.start = 0;
      gifEditor.end = Math.min(3, job.durationSeconds || 3);

      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      backdrop.innerHTML = `
        <div class="modal gif-modal">
          <video id="gifSourceVideo" src="${job.mediaUrl}" controls></video>
          <div class="gif-panel">
            <div class="gif-error" id="gifError"></div>
            <div class="gif-range-row">
              <button type="button" onclick="setGifStart()">⏺ Set start (<span id="gifStartLabel">0:00</span>)</button>
              <button type="button" onclick="setGifEnd()">⏺ Set end (<span id="gifEndLabel">0:03</span>)</button>
              <span class="gif-duration-pill" id="gifDurationPill"></span>
            </div>
            <div class="gif-options-row">
              <label>FPS
                <select id="gifFps">
                  <option value="8">8</option>
                  <option value="12" selected>12</option>
                  <option value="15">15</option>
                  <option value="24">24</option>
                </select>
              </label>
              <label>Width
                <select id="gifWidth">
                  <option value="320">320px</option>
                  <option value="480" selected>480px</option>
                  <option value="640">640px</option>
                </select>
              </label>
              <button class="gif-create-btn" id="gifCreateBtn" type="button" onclick="createGif()">
                <span class="btn-spinner"></span>
                <span class="btn-label">🎞 Create GIF</span>
              </button>
            </div>
            <div id="gifExistingWrap">${gifExistingHtml(job)}</div>
          </div>
          <button class="modal-close">Close</button>
        </div>`;
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
      backdrop.querySelector('.modal-close').onclick = close;
      document.body.appendChild(backdrop);
      function close() { backdrop.remove(); previewOpen = false; }
      previewOpen = true;

      updateGifRangeUi();
    }

    function setGifStart() {
      const video = document.getElementById('gifSourceVideo');
      gifEditor.start = video.currentTime;
      if (gifEditor.end <= gifEditor.start) gifEditor.end = gifEditor.start + 1;
      updateGifRangeUi();
    }

    function setGifEnd() {
      const video = document.getElementById('gifSourceVideo');
      gifEditor.end = video.currentTime;
      updateGifRangeUi();
    }

    async function createGif() {
      const errorEl = document.getElementById('gifError');
      const btn = document.getElementById('gifCreateBtn');
      errorEl.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch(`/api/jobs/${gifEditor.jobId}/gif`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            start: gifEditor.start,
            end: gifEditor.end,
            fps: Number(document.getElementById('gifFps').value),
            width: Number(document.getElementById('gifWidth').value),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not create the GIF.');

        toast('🎞 GIF ready', 'Added to this video’s library');
        await fetchJobs();
        const job = state.jobs.find((j) => j.id === gifEditor.jobId);
        document.getElementById('gifExistingWrap').innerHTML = job ? gifExistingHtml(job) : '';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    }

    async function deleteGif(jobId, gifId) {
      if (!confirm('Delete this GIF?')) return;
      await fetch(`/api/jobs/${jobId}/gif/${gifId}`, { method: 'DELETE' });
      await fetchJobs();
      const job = state.jobs.find((j) => j.id === jobId);
      const wrap = document.getElementById('gifExistingWrap');
      if (wrap) wrap.innerHTML = job ? gifExistingHtml(job) : '';
    }

    async function deleteJob(id) {
      if (!confirm('Delete this video and its history entry?')) return;
      await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
      fetchJobs();
    }

    async function retryJob(id) {
      await fetch(`/api/jobs/${id}/retry`, { method: 'POST' });
      fetchJobs();
    }

    document.getElementById('search').addEventListener('input', (e) => { state.search = e.target.value; render(); });
    document.getElementById('sort').addEventListener('change', (e) => { state.sort = e.target.value; render(); });

    document.getElementById('pasteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('pasteUrl');
      const btn = document.getElementById('pasteBtn');
      const errorEl = document.getElementById('pasteError');
      const url = input.value.trim();

      errorEl.classList.remove('show');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Could not start that download.');
        input.value = '';
        toast('⏳ Started', shortUrl(url));
        fetchJobs();
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Ticks the "downloading" elapsed-time labels without waiting for the next poll.
    setInterval(() => {
      document.querySelectorAll('.elapsed[data-started]').forEach((el) => {
        el.textContent = fmtElapsed(Number(el.dataset.started));
      });
    }, 1000);

    fetchJobs();
    setInterval(fetchJobs, 3000);
  </script>
</body>
</html>
